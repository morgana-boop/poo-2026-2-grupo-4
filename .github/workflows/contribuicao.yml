name: Atualizar Métricas de Contribuição

on:
  schedule:
    # 02:00 UTC corresponde a 23:00 no horário de Brasília / Imperatriz (UTC-3)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      escopo:
        description: "Escopo Git ('--all' para todas as branches ou 'main' para consolidado)"
        required: true
        default: "--all"
        type: choice
        options:
          - "--all"
          - "main"

permissions:
  contents: read

jobs:
  atualizar-metricas:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar histórico completo do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular contribuições e publicar no Summary
        env:
          ESCOPO_MANUAL: ${{ inputs.escopo }}
        run: |
          ESCOPO="${ESCOPO_MANUAL:---all}"
          python scripts/contribuicao.py --ref="$ESCOPO" >> "$GITHUB_STEP_SUMMARY"